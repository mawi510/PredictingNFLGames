# Reverse proxy for the model API. Place at
#   /etc/nginx/conf.d/api.promatchpredict.com.conf
# then run certbot (see infra/README.md), which rewrites this to add the TLS
# (443) server block and an http->https redirect automatically.
server {
    listen 80;
    server_name api.promatchpredict.com;

    # Lightweight health passthrough for uptime checks.
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# Serves the static frontend at the apex + www. Place at
#   /etc/nginx/conf.d/promatchpredict.com.conf
# then run certbot (see infra/README.md), which adds the TLS (443) block and the
# http->https redirect. Replaces any old Streamlit proxy config for this domain.
server {
    listen 80;
    server_name promatchpredict.com www.promatchpredict.com;

    root /var/www/promatchpredict;
    index index.html;

    # Static export uses trailingSlash, so pages are <route>/index.html.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}

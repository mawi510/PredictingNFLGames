name: Deploy Model API

# Builds the model-serving image and deploys it to EC2 on every merge to main
# that touches the API or its deploy config. Replaces the old manual flow
# (SSH in -> git pull -> restart). workflow_dispatch allows manual redeploys.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "infra/docker-compose.yml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

env:
  # GHCR requires a lowercase path; this repo is mawi510/PredictingNFLGames.
  IMAGE: ghcr.io/mawi510/predictingnflgames-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64 # EC2 is x86_64; switch to arm64 if Graviton
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/nfl-spread-model
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
            # Wait for the container to report healthy before declaring success.
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
                echo "API healthy"; exit 0
              fi
              echo "waiting for API... ($i)"; sleep 2
            done
            echo "API did not become healthy"; docker compose logs --tail=50 api; exit 1

name: Weekly NFL Data + Backtest

# Refreshes the current-season feature data and recomputes the season win/loss
# track record. Ported from the old monorepo's currentnfldata.yml.
#
# Timing: Wednesdays at 13:00 UTC (~8-9am ET). nfl_data_py publishes the coming
# week's spreads on Wednesday and the first game is Thursday, so this runs after
# spreads update but before kickoff. (Old cron was "0 4 * * 4" = late Wed ET.)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 3"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.10 so scikit-learn 1.1.2 (the backtest model's version) installs from
          # a wheel; newer Python has no 1.1.2 wheel and falls back to a failing build.
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # One coherent, pinned set: sklearn 1.1.2 needs numpy 1.23; pandas <2.1
          # keeps nfl_data_py + numpy 1.23 happy.
          pip install \
            numpy==1.23.5 scipy==1.9.3 scikit-learn==1.1.2 joblib==1.2.0 \
            "pandas>=1.5,<2.1" requests s3fs boto3 nfl_data_py

      - name: Refresh current-season data
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python current_nfl_data.py

      - name: Recompute season track record
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Pulls the trained model from S3 to score the backtest, and writes
          # the result back to S3 (the API serves it live — no redeploy needed).
          MODEL_PATH: api/model.pkl
          MODEL_S3_URI: s3://nfl.data/models/cover_classifier.joblib
          TRACK_RECORD_S3_URI: s3://nfl.data/track_record.json
        run: python -m pipeline.backtest

      - name: Refresh per-team current features
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Per-team latest-week features for the /teams prediction endpoint.
          CURRENT_FEATURES_S3_URI: s3://nfl.data/current_features.json
        run: python -m pipeline.current_features

      - name: Refresh team stat series
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Pull the rich historical metrics from S3 (the committed training CSV
          # is a limited snapshot); current season comes from the refreshed file.
          HISTORICAL_DATA_PATH: s3://nfl.data/nfl_historical_data.csv
          TEAM_STATS_S3_URI: s3://nfl.data/team_stats.json
        run: python -m pipeline.team_stats

      - name: Commit refreshed data snapshot
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f nfl_current_data.csv
          git commit -m "Weekly data refresh" || echo "No changes to commit"
          git push

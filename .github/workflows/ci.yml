name: CI

# Validates that changes still build and boot the model image before merge.
# Builds from the PR's contents (no push) and smoke-tests the API with the
# committed margin-v2 bundle (baked into the image; no AWS creds needed), so
# it also passes on fork PRs.
on:
  pull_request:
    paths:
      - "api/**"
      - "pipeline/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load locally, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          load: true
          tags: nfl-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot container (no AWS creds — model is baked into the image)
        run: |
          docker run -d --name api -p 8000:8000 nfl-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "API up"; break
            fi
            echo "waiting ($i)"; sleep 2
          done

      - name: Smoke-test endpoints
        run: |
          set -e
          echo "== /health (margin-v2 bundle loaded) =="
          curl -fsS http://localhost:8000/health | tee /tmp/h.json
          grep -q '"n_features":44' /tmp/h.json
          grep -q '"model_loaded":true' /tmp/h.json
          grep -q '"model_version":"margin-v2' /tmp/h.json

          echo "== /predict (valid -> 200, real prediction) =="
          code=$(curl -s -o /tmp/p.json -w "%{http_code}" -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"team":"KC","features":{"is_home":1.0,"rest":7.0},"spread":-6.5}')
          test "$code" = "200"
          cat /tmp/p.json
          grep -q '"is_stub":false' /tmp/p.json
          grep -q '"predicted_margin"' /tmp/p.json

          echo "== /predict (unknown feature -> 422) =="
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' -d '{"features":{"bogus":1},"spread":-6.5}')
          test "$code" = "422"

          echo "== /predict (missing spread -> 422) =="
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' -d '{"features":{"is_home":1.0}}')
          test "$code" = "422"
          echo "All smoke tests passed."

      - name: Container logs on failure
        if: failure()
        run: docker logs api || true

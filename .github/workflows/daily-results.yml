name: Daily Results

# Regrades the season track record every morning in season, so final scores,
# the record and units reach the site the day after games. It does NOT refresh
# the week's data: the slate, its spreads and its picks stay as set by the
# Wednesday job. Only results change.
on:
  workflow_dispatch:
  schedule:
    # 11:00 UTC (6-7am ET), September through February.
    - cron: "0 11 * 9-12,1-2 *"

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy==1.23.5 scipy==1.9.3 xgboost==2.1.3 joblib==1.2.0 \
            "pandas>=1.5,<2.1" pyarrow requests s3fs boto3 nfl_data_py

      - name: Regrade season track record
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TRACK_RECORD_S3_URI: s3://nfl.data/track_record.json
        run: python -m pipeline.backtest
